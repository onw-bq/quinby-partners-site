# Pages CMS configuration: what Becky and Elena can edit at app.pagescms.org.
# Saving in Pages CMS commits to GitHub, and Cloudflare republishes the site automatically.
media:
  input: src/media
  output: /media

content:
  - name: collection
    label: The Collection (listings & sales)
    type: file
    path: content/collection.json
    fields:
      - name: homes
        label: Homes (newest first; the first one is shown large)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {neighborhood} · {status}"
        fields:
          - { name: name, label: Home name, type: string, required: true }
          - { name: neighborhood, label: Neighborhood, type: string }
          - { name: style, label: Style, type: string }
          - { name: year, label: Year built, type: string }
          - name: status
            label: Status
            type: select
            options:
              values: [For sale, Coming soon, Pending, Sold]
          - { name: slug, label: "Web address (lowercase-with-dashes, e.g. 1912-lake-of-the-isles; don't change after launch)", type: string, required: true }
          - { name: tagline, label: One line on what makes it singular, type: string }
          - { name: architect, label: Architect or builder, type: string }
          - { name: details, label: "Details (optional, e.g. 4 bedrooms · 3 baths)", type: string }
          - { name: price, label: Price (shown only while for sale or coming soon), type: string }
          - { name: photo, label: Main photo, type: image }
          - { name: story, label: "The house's story (leave a blank line between paragraphs)", type: text }
          - name: gallery
            label: Gallery
            type: object
            list: true
            fields:
              - { name: photo, label: Photo, type: image }
              - { name: caption, label: Caption (like a museum placard), type: string }
          - { name: video, label: Film (YouTube link), type: string }
          - { name: quote, label: Quote (optional), type: text }
          - { name: quoteBy, label: Quote by, type: string }

  - name: gifts
    label: Giving record
    type: file
    path: content/gifts.json
    fields:
      - name: gifts
        label: Gifts (newest first; totals on the site add up automatically)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{month} · {nonprofit}"
        fields:
          - { name: month, label: Month closed (e.g. November 2026), type: string }
          - { name: nonprofit, label: Nonprofit, type: string, required: true }
          - { name: cause, label: Cause area, type: string }
          - { name: neighborhood, label: Neighborhood of the home (never the address), type: string }
          - { name: amount, label: Amount, type: number, default: 1000 }

  - name: testimonials
    label: Testimonials
    type: file
    path: content/testimonials.json
    fields:
      - name: testimonials
        label: Testimonials (the featured one shows large on the homepage, plus the next two)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {detail}"
        fields:
          - { name: quote, label: Quote, type: text, required: true }
          - { name: name, label: Client name, type: string }
          - { name: detail, label: Detail (e.g. Sold in Kenwood), type: string }
          - { name: featured, label: Feature on the homepage, type: boolean }

  - name: publication
    label: Publication (feature & Register)
    type: file
    path: content/publication.json
    fields:
      - name: feature
        label: This month's feature
        type: object
        fields:
          - { name: name, label: Home name, type: string }
          - { name: neighborhood, label: Neighborhood, type: string }
          - { name: year, label: Year built, type: string }
          - { name: style, label: Style, type: string }
          - { name: line, label: One line on what makes it singular, type: text }
          - { name: slug, label: "Web address (lowercase-with-dashes; use a new one for each month's feature)", type: string }
          - { name: architect, label: Architect or builder, type: string }
          - { name: photo, label: Main photo, type: image }
          - { name: story, label: "The story (leave a blank line between paragraphs)", type: text }
          - name: gallery
            label: Gallery
            type: object
            list: true
            fields:
              - { name: photo, label: Photo, type: image }
              - { name: caption, label: Caption (like a museum placard), type: string }
          - { name: video, label: Film (YouTube link), type: string }
          - { name: quote, label: Quote (optional), type: text }
          - { name: quoteBy, label: Quote by, type: string }
          - { name: credits, label: "Credits (photographer, architect, builder)", type: string }
      - name: register
        label: Register entries (newest first)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {neighborhood}"
        fields:
          - { name: name, label: Home name, type: string }
          - { name: neighborhood, label: Neighborhood, type: string }
          - { name: year, label: Year built, type: string }
          - { name: style, label: Style, type: string }
          - { name: photo, label: Photo, type: image }

  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - { name: heroEyebrow, label: Small line above the headline, type: string }
      - { name: heroTitle, label: Headline, type: string }
      - { name: heroSub, label: Line under the headline, type: text }
      - { name: phrases, label: "\"We sell…\" phrases (in order; the last one stays on screen)", type: string, list: true }
      - name: buyingLine
        label: Buying page rolling line
        type: object
        fields:
          - { name: first, label: Opening words, type: string }
          - { name: phrases, label: Phrases (in order; the last one stays on screen), type: string, list: true }
      - name: sellingLine
        label: Selling page rolling line
        type: object
        fields:
          - { name: first, label: Opening words, type: string }
          - { name: phrases, label: Phrases (in order; the last one stays on screen), type: string, list: true }

  - name: neighborhoods
    label: Neighborhood pages
    type: file
    path: content/neighborhoods.json
    fields:
      - name: neighborhoods
        label: Neighborhoods with full pages
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {city}"
        fields:
          - { name: name, label: Name, type: string }
          - { name: slug, label: Web address (lowercase-with-dashes; don't change after launch), type: string }
          - { name: city, label: City, type: string }
          - name: area
            label: Area
            type: select
            options:
              values: [south-minneapolis, around-the-lakes, st-paul, edina, golden-valley]
          - { name: summary, label: One-sentence summary (describe places, never people), type: text }
          - { name: architecture, label: The architecture, type: text }
          - { name: setting, label: The setting, type: text }
          - { name: clip, label: B-roll description, type: string }
          - { name: photo, label: Hero photo, type: image }

  - name: areas
    label: Neighborhood areas
    type: file
    path: content/areas.json
    fields:
      - name: areas
        label: Areas
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Area name, type: string }
          - { name: slug, label: Web address (don't change after launch), type: string }
          - { name: lede, label: Intro line, type: text }
          - name: neighborhoods
            label: Neighborhoods in this area
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: name, label: Name, type: string }
              - { name: page, label: "Full page web address, if it has one (e.g. kenwood)", type: string }
              - { name: line, label: One line about its homes (places, never people), type: text }

  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    fields:
      - { name: publicationName, label: Publication name, type: string }
      - { name: publicationLive, label: "Publication is live (shows it in the menu, on pages and in the footer band)", type: boolean }
      - { name: phone, label: Phone, type: string }
      - { name: email, label: Email, type: string }

  - name: books
    label: Books for icon homes (private)
    type: file
    path: content/books.json
    fields:
      - name: books
        label: "Personalized books. Each lives at quinbypartners.com/book/[web address]; send it through a GHL trigger link."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{homeName} · {recipients}"
        fields:
          - { name: homeName, label: Home name (shown on the cover), type: string, required: true }
          - { name: recipients, label: "Prepared for (e.g. Anne and David)", type: string }
          - { name: slug, label: "Private web address (add a few random letters, e.g. lake-isles-k7q2)", type: string, required: true }
          - { name: note, label: "Personal note from Becky (blank line between paragraphs)", type: text }
          - { name: coverPhoto, label: Cover photo of their home, type: image }
          - { name: tag, label: "GHL tag for this book (e.g. book: lake isles tudor)", type: string }

  - name: book
    label: The master book
    type: file
    path: content/book.json
    fields:
      - { name: title, label: Book title, type: string }
      - { name: gateAfter, label: "Ask for name and email after this many pages", type: number }
      - name: pages
        label: Pages (in order; the first is the cover, the last is the note from Becky)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{eyebrow} · {title}"
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Title, type: string }
          - { name: body, label: "Text (blank line between paragraphs)", type: text }
          - { name: photo, label: Photo, type: image }
          - { name: clip, label: "B-roll description (shown until a photo is added; leave both empty for a text-only page)", type: string }
